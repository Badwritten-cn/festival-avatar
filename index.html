<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d1f">
<title>月满山河 · 双节头像工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070d1f; --night1:#0b1630; --night2:#14244d; --night3:#1c3f7d;
  --gold:#e8c66f; --gold-b:#ffd98a; --gold-dim:#a8894a;
  --red:#c8102e; --red-b:#e8323f; --paper:#f7f1e3;
  --font-d:'ZCOOL XiaoWei','Songti SC','STSong',serif;
  --font-b:'Noto Serif SC','Songti SC',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-b); color:var(--paper); background:var(--ink);
  background-image:
    radial-gradient(ellipse 60% 40% at 85% -5%, rgba(232,198,111,.14), transparent 60%),
    radial-gradient(ellipse 70% 45% at 10% 108%, rgba(200,16,46,.16), transparent 60%),
    linear-gradient(175deg,#0a1226 0%, #070d1f 55%, #0a0f22 100%);
  min-height:100dvh; overflow-x:hidden;
}
/* ── 星空 ── */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.halo-moon{position:fixed;top:-70px;right:-60px;width:260px;height:260px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,170,.22),rgba(255,236,170,.05) 45%,transparent 70%);z-index:0}
.halo-red{position:fixed;bottom:-90px;left:-70px;width:300px;height:300px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(232,50,63,.14),transparent 65%);z-index:0}
/* ── 布局 ── */
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:clamp(18px,4vw,32px) 18px calc(28px + env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:20px;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.55em;text-indent:.55em;color:var(--gold);opacity:.85;margin-bottom:10px}
h1{font-family:var(--font-d);font-weight:400;font-size:clamp(34px,9vw,44px);letter-spacing:.14em;text-indent:.14em;line-height:1.15;
  background:linear-gradient(180deg,#fdf6e0 15%,var(--gold-b) 55%,var(--gold-dim));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 14px rgba(232,198,111,.25))}
.sub{margin-top:8px;font-size:13.5px;color:rgba(247,241,227,.62);letter-spacing:.12em}
.dates{display:flex;justify-content:center;gap:10px;margin-top:14px}
.chip-date{font-size:12px;letter-spacing:.1em;padding:5px 13px;border-radius:999px;border:1px solid}
.chip-mid{color:#f3e6b8;border-color:rgba(232,198,111,.45);background:rgba(232,198,111,.08)}
.chip-nat{color:#ffb9b9;border-color:rgba(232,50,63,.5);background:rgba(232,50,63,.1)}
/* ── 主卡 ── */
.card{background:linear-gradient(180deg,rgba(20,36,77,.5),rgba(11,22,48,.55));
  border:1px solid rgba(232,198,111,.22);border-radius:22px;padding:16px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:rise .8s .12s ease both}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;
  background:radial-gradient(circle at 50% 32%,#152649 0%,#0a142e 70%);
  border:1px solid rgba(232,198,111,.14)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
/* 上传空态 */
.dropzone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  cursor:pointer;transition:background .25s}
.dropzone:hover,.dropzone.drag{background:rgba(232,198,111,.05)}
.dz-ring{width:118px;height:118px;border-radius:50%;border:1.5px dashed rgba(232,198,111,.55);
  display:flex;align-items:center;justify-content:center;animation:breathe 3.2s ease-in-out infinite;position:relative}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(232,198,111,.12)}50%{transform:scale(1.045);box-shadow:0 0 40px 4px rgba(232,198,111,.14)}}
.dz-ring svg{width:52px;height:52px}
.dz-t1{font-family:var(--font-d);font-size:19px;letter-spacing:.22em;text-indent:.22em;color:var(--gold-b)}
.dz-t2{font-size:12px;color:rgba(247,241,227,.5);letter-spacing:.08em}
/* 编辑器控制 */
.editor{display:none}
.editor.on{display:block;animation:rise .4s ease both}
.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.frames.disabled{opacity:.35;pointer-events:none}
.style-label{margin:16px 2px 0;font-size:11.5px;letter-spacing:.28em;color:rgba(232,198,111,.75)}
.frame-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:12px;
  border:1px solid rgba(247,241,227,.12);background:rgba(7,13,31,.4);cursor:pointer;transition:.2s;color:rgba(247,241,227,.75)}
.frame-chip:active{transform:scale(.96)}
.frame-chip .dot{width:30px;height:30px;border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.frame-chip span{font-size:12px;letter-spacing:.12em;text-indent:.12em;font-family:var(--font-d);white-space:nowrap}
.frame-chip.sel{border-color:var(--gold);background:rgba(232,198,111,.1);color:var(--gold-b);box-shadow:0 0 18px -4px rgba(232,198,111,.35)}
/* 缩放 */
.zoomrow{display:flex;align-items:center;gap:12px;margin:10px 2px 4px;color:rgba(247,241,227,.55);font-size:12px;letter-spacing:.1em}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--gold-dim),rgba(232,198,111,.2));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fff3d6,var(--gold) 60%,var(--gold-dim));box-shadow:0 2px 10px rgba(232,198,111,.5);border:none}
/* 按钮 */
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;font-family:var(--font-d);font-size:17px;letter-spacing:.28em;text-indent:.28em;padding:14px 8px;border-radius:14px;
  border:1px solid transparent;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.97)}
.btn-primary{color:#2b1608;font-weight:600;
  background:linear-gradient(135deg,#f5d98b,#e8b64f 55%,#d99b3a);
  box-shadow:0 10px 26px -8px rgba(232,182,79,.55), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{color:var(--gold-b);border-color:rgba(232,198,111,.4);background:rgba(232,198,111,.06)}
.btn-ghost:hover{background:rgba(232,198,111,.13)}
.hint{margin-top:14px;text-align:center;font-size:11.5px;color:rgba(247,241,227,.4);letter-spacing:.06em;line-height:1.7}
/* ── 结果弹层 ── */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(4,8,20,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal.on{display:flex;animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{width:min(420px,100%);text-align:center;animation:rise .35s ease both}
.modal-box img{width:100%;border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.9),0 0 0 1px rgba(232,198,111,.25)}
.modal-t{font-family:var(--font-d);font-size:20px;letter-spacing:.24em;text-indent:.24em;color:var(--gold-b);margin-bottom:14px}
.modal-hint{font-size:12.5px;color:rgba(247,241,227,.55);margin-top:12px;line-height:1.8}
.modal-actions{display:flex;gap:10px;margin-top:16px}
footer{margin-top:26px;text-align:center;font-size:11.5px;color:rgba(247,241,227,.35);letter-spacing:.12em;line-height:2}
footer b{color:rgba(232,198,111,.55);font-weight:400}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="halo-moon"></div>
<div class="halo-red"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">MID-AUTUMN × NATIONAL DAY</div>
    <h1>月满山河</h1>
    <div class="sub">双节头像工坊 · 一张照片，两种团圆</div>
    <div class="dates">
      <span class="chip-date chip-mid">中秋 · 09.25</span>
      <span class="chip-date chip-nat">国庆 · 10.01</span>
    </div>
  </header>

  <div class="card">
    <div class="stage" id="stage">
      <canvas id="cv" width="800" height="800"></canvas>
      <div class="dropzone" id="dz">
        <div class="dz-ring">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4.2" fill="#f8ecc9" opacity=".9"/>
            <path d="M12 5.6a6.4 6.4 0 1 0 6.4 6.4" stroke="#e8c66f" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
            <circle cx="18.8" cy="7" r=".9" fill="#ffd98a"/><circle cx="4.6" cy="15.5" r=".7" fill="#ffd98a"/><circle cx="7" cy="4.4" r=".6" fill="#ffd98a"/>
          </svg>
        </div>
        <div class="dz-t1">换上双节头像</div>
        <div class="dz-t2">点击上传照片，或拖入此处</div>
      </div>
    </div>

    <div class="editor" id="editor">
      <div class="style-label">样式模板</div>
      <div class="frames" id="styles">
        <button class="frame-chip sel" data-s="ring"><span class="dot" style="background:linear-gradient(135deg,#e8c66f,#c8102e 55%,#1e4285)"></span><span>圆框</span></button>
        <button class="frame-chip" data-s="flag"><span class="dot" style="background:linear-gradient(180deg,#de2910 62%,#ffde00 62%)"></span><span>国旗渐隐</span></button>
        <button class="frame-chip" data-s="lantern"><span class="dot" style="background:radial-gradient(circle at 50% 40%,#e8323f,#5e0715)"></span><span>灯笼</span></button>
        <button class="frame-chip" data-s="moon"><span class="dot" style="background:radial-gradient(circle at 50% 35%,#2a4d8f,#050a1c)"></span><span>圆月夜</span></button>
        <button class="frame-chip" data-s="stamp"><span class="dot" style="background:linear-gradient(180deg,#f7f1e3,#d9c9a3)"></span><span>邮票</span></button>
        <button class="frame-chip" data-s="badge"><span class="dot" style="background:radial-gradient(circle at 50% 35%,#ffd94a,#c8102e 72%)"></span><span>徽章</span></button>
        <button class="frame-chip" data-s="sticker"><span class="dot" style="background:radial-gradient(circle at 50% 40%,#fdfaf2,#e8c66f)"></span><span>贴纸</span></button>
      </div>
      <div class="style-label">圆框边框</div>
      <div class="frames" id="frames">
        <button class="frame-chip sel" data-f="national"><span class="dot" style="background:linear-gradient(180deg,#e8323f,#a30d24)"></span><span>国庆</span></button>
        <button class="frame-chip" data-f="mid"><span class="dot" style="background:radial-gradient(circle at 50% 30%,#1e4285,#0c1c40)"></span><span>中秋</span></button>
        <button class="frame-chip" data-f="duo"><span class="dot" style="background:linear-gradient(90deg,#c8102e 50%,#0e2148 50%)"></span><span>双节</span></button>
        <button class="frame-chip" data-f="yueqi"><span class="dot" style="background:linear-gradient(90deg,#0e2148 50%,#c8102e 50%)"></span><span>月旗</span></button>
        <button class="frame-chip" data-f="rabbit"><span class="dot" style="background:radial-gradient(circle at 50% 30%,#2a4d8f,#0a1838)"></span><span>玉兔</span></button>
        <button class="frame-chip" data-f="mooncake"><span class="dot" style="background:linear-gradient(180deg,#c98a3e,#7a4a1a)"></span><span>月饼</span></button>
        <button class="frame-chip" data-f="guihua"><span class="dot" style="background:linear-gradient(180deg,#a3742e,#5f3f0d)"></span><span>桂花</span></button>
        <button class="frame-chip" data-f="kongming"><span class="dot" style="background:linear-gradient(180deg,#12295c,#060d20)"></span><span>孔明灯</span></button>
        <button class="frame-chip" data-f="shanhe"><span class="dot" style="background:linear-gradient(180deg,#d4a13c,#8a5a1a)"></span><span>山河</span></button>
        <button class="frame-chip" data-f="lantern"><span class="dot" style="background:linear-gradient(180deg,#c8102e,#5e0715)"></span><span>灯笼</span></button>
        <button class="frame-chip" data-f="firework"><span class="dot" style="background:linear-gradient(180deg,#1a2c5e,#05081a)"></span><span>烟花</span></button>
        <button class="frame-chip" data-f="xiangyun"><span class="dot" style="background:linear-gradient(180deg,#c9982e,#7a5a10)"></span><span>祥云</span></button>
        <button class="frame-chip" data-f="tuanyuan"><span class="dot" style="background:linear-gradient(180deg,#b3762c,#6e4212)"></span><span>团圆</span></button>
        <button class="frame-chip" data-f="chanjuan"><span class="dot" style="background:linear-gradient(180deg,#1a3a7a,#0a1838)"></span><span>婵娟</span></button>
        <button class="frame-chip" data-f="haisy"><span class="dot" style="background:linear-gradient(180deg,#0e3a5c,#071a30)"></span><span>海月</span></button>
        <button class="frame-chip" data-f="yupan"><span class="dot" style="background:radial-gradient(circle at 50% 30%,#f8ecc9,#2a4d8f)"></span><span>玉盘</span></button>
        <button class="frame-chip" data-f="wangyue"><span class="dot" style="background:linear-gradient(180deg,#8a5a1a,#4a2c08)"></span><span>望岳</span></button>
        <button class="frame-chip" data-f="duojiao"><span class="dot" style="background:linear-gradient(180deg,#c8102e,#7a0e0e)"></span><span>多娇</span></button>
      </div>
      <div class="zoomrow">
        <span>缩放</span>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="btnChange">换一张</button>
        <button class="btn btn-primary" id="btnGen">生成头像</button>
      </div>
    </div>
  </div>

  <div class="hint">全部处理在本机完成，照片不会上传到任何服务器<br>生成后长按图片即可保存转发</div>

  <footer>月满山河 · <b>中秋 × 国庆</b> 双节头像工坊</footer>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-t">头像已生成</div>
    <img id="resultImg" alt="生成的双节头像">
    <div class="modal-hint">手机端：长按上方图片保存到相册<br>电脑端：点击下方按钮下载</div>
    <div class="modal-actions">
      <a class="btn btn-primary" id="btnDl" download="双节头像-月满山河.png">下载头像</a>
      <button class="btn btn-ghost" id="btnAgain">继续编辑</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*">

<script>
/* ─────────── 星空背景 ─────────── */
(function(){
  var sky=document.getElementById('sky');
  for(var i=0;i<70;i++){
    var s=document.createElement('div');s.className='star';
    var z=Math.random()<.75?1:2;
    s.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+(Math.random()*3.5)+'s;animation-duration:'+(2.5+Math.random()*3)+'s';
    sky.appendChild(s);
  }
})();

/* ─────────── 画布与状态 ─────────── */
var S=800, C=400, R_IN=330, R_OUT=396, R_MID=(R_IN+R_OUT)/2;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var img=null, frame='national', style='ring', zoom=1, ox=0, oy=0, base=1;
var dz=document.getElementById('dz'), editor=document.getElementById('editor'), fileInput=document.getElementById('file');

function loadFile(f){
  if(!f||!f.type||f.type.indexOf('image')!==0)return;
  var url=URL.createObjectURL(f);
  var im=new Image();
  im.onload=function(){ img=im; base=Math.max(2*R_IN/im.naturalWidth,2*R_IN/im.naturalHeight); zoom=1;ox=0;oy=0;
    document.getElementById('zoom').value=1; dz.style.display='none'; editor.classList.add('on'); render(); };
  im.src=url;
}
function loadDemo(){
  var im=new Image();
  im.onload=function(){ img=im; base=Math.max(2*R_IN/im.naturalWidth,2*R_IN/im.naturalHeight); zoom=1;ox=0;oy=0;
    dz.style.display='none'; editor.classList.add('on'); render(); };
  var oc=document.createElement('canvas');oc.width=oc.height=700;var c=oc.getContext('2d');
  var g=c.createLinearGradient(0,0,700,700);g.addColorStop(0,'#7f9bb8');g.addColorStop(.5,'#5c7ea3');g.addColorStop(1,'#41597a');
  c.fillStyle=g;c.fillRect(0,0,700,700);
  c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(350,300,105,0,7);c.fill();
  c.beginPath();c.arc(350,560,180,Math.PI,0);c.fill();
  im.src=oc.toDataURL();
}
function clampOff(){
  var s=base*zoom, w=img.naturalWidth*s/2, h=img.naturalHeight*s/2;
  ox = w>R_IN ? Math.max(Math.min(ox, w-R_IN), R_IN-w) : 0;
  oy = h>R_IN ? Math.max(Math.min(oy, h-R_IN), R_IN-h) : 0;
}
function photoCircle(r){
  if(!img)return;
  ctx.save();ctx.beginPath();ctx.arc(C,C,r,0,7);ctx.clip();
  var s=base*zoom,iw=img.naturalWidth*s,ih=img.naturalHeight*s;
  ctx.drawImage(img,C-iw/2+ox,C-ih/2+oy,iw,ih);
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,S,S);
  if(style==='ring'){
    if(img){
      clampOff();
      ctx.save();ctx.beginPath();ctx.arc(C,C,R_IN,0,7);ctx.clip();
      var s=base*zoom,iw=img.naturalWidth*s,ih=img.naturalHeight*s;
      ctx.drawImage(img,C-iw/2+ox,C-ih/2+oy,iw,ih);
      var vg=ctx.createRadialGradient(C,C,R_IN*.55,C,C,R_IN);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(7,10,25,.3)');
      ctx.fillStyle=vg;ctx.fillRect(0,0,S,S);
      ctx.restore();
    }
    FRAMES[frame](ctx);
    return;
  }
  TEMPLATES[style](ctx);
}

/* ─────────── 样式模板 ─────────── */
function bannerPath(c,x,y,w,h){
  var n=18;
  c.beginPath();
  c.moveTo(x,y);c.lineTo(x+w,y);c.lineTo(x+w-n,y+h/2);c.lineTo(x+w,y+h);
  c.lineTo(x,y+h);c.lineTo(x+n,y+h/2);c.closePath();
}
var TEMPLATES={
  /* 国旗渐隐：整面标准国旗半透明覆盖（国旗原样） */
  flag:function(){
    photoCircle(380);
    ctx.save();ctx.beginPath();ctx.arc(C,C,380,0,7);ctx.clip();
    ctx.globalAlpha=.55;
    drawFlag(ctx,C-380,C-253,50.67);
    ctx.globalAlpha=1;
    ctx.restore();
    edgeStroke(ctx,'rgba(243,211,131,.95)',5,3);
  },
  /* 灯笼：照片裁成灯笼形 */
  lantern:function(){
    var gl=ctx.createRadialGradient(C,C,140,C,C,400);
    gl.addColorStop(0,'rgba(232,50,63,.22)');gl.addColorStop(1,'rgba(232,50,63,0)');
    ctx.fillStyle=gl;ctx.fillRect(0,0,S,S);
    ctx.strokeStyle='#f3d383';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(C,26);ctx.lineTo(C,104);ctx.stroke();
    if(img){ctx.save();ctx.beginPath();ctx.ellipse(C,C,285,255,0,0,7);ctx.clip();
      var s=base*zoom,iw=img.naturalWidth*s,ih=img.naturalHeight*s;
      ctx.drawImage(img,C-iw/2+ox,C-ih/2+oy,iw,ih);ctx.restore();}
    ctx.strokeStyle='rgba(232,50,63,.4)';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(C,C,180,255,0,0,7);ctx.stroke();
    ctx.beginPath();ctx.ellipse(C,C,90,255,0,0,7);ctx.stroke();
    ctx.strokeStyle='#f3d383';ctx.lineWidth=6;
    ctx.beginPath();ctx.ellipse(C,C,285,255,0,0,7);ctx.stroke();
    ctx.fillStyle='#f3d383';
    ctx.beginPath();ctx.moveTo(C-84,100);ctx.lineTo(C+84,100);ctx.lineTo(C+64,148);ctx.lineTo(C-64,148);ctx.closePath();ctx.fill();

/* ─────────── 边框绘制 ─────────── */
function ringPath(c){c.beginPath();c.arc(C,C,R_OUT,0,7);c.arc(C,C,R_IN,0,7,true);}
function star(c,cx,cy,r,rot,color){
  c.beginPath();
  for(var i=0;i<5;i++){
    var a=rot-Math.PI/2+i*2*Math.PI/5;
    var bx=cx+Math.cos(a)*r,by=cy+Math.sin(a)*r;
    if(i===0)c.moveTo(bx,by);else c.lineTo(bx,by);
    var a2=a+Math.PI/5;
    c.lineTo(cx+Math.cos(a2)*r*.382,cy+Math.sin(a2)*r*.382);
  }
  c.closePath();c.fillStyle=color;c.fill();
}
function ringPos(deg){var a=deg*Math.PI/180;return [C+Math.cos(a)*R_MID, C+Math.sin(a)*R_MID];}
function edgeStroke(c,color,wOut,wIn){
  c.beginPath();c.arc(C,C,R_OUT-wOut/2+.5,0,7);c.lineWidth=wOut;c.strokeStyle=color;c.stroke();
  c.beginPath();c.arc(C,C,R_IN+wIn/2-.5,0,7);c.lineWidth=wIn;c.strokeStyle=color;c.stroke();
}
/* 金色烟花 */
function burst(c,cx,cy,r,color){
  c.strokeStyle=color;c.fillStyle=color;c.lineWidth=2.2;c.lineCap='round';
  for(var i=0;i<8;i++){
    var a=i*Math.PI/4+Math.PI/8;
    var x2=cx+Math.cos(a)*r,y2=cy+Math.sin(a)*r;
    c.beginPath();c.moveTo(cx+Math.cos(a)*r*.35,cy+Math.sin(a)*r*.35);c.lineTo(x2,y2);c.stroke();
    c.beginPath();c.arc(x2,y2,2.4,0,7);c.fill();
  }
  c.beginPath();c.arc(cx,cy,3,0,7);c.fill();
}
/* 金色红灯笼 */
function lantern(c,cx,cy,s){
  s=s||1;
  c.save();c.translate(cx,cy);c.scale(s,s);
  c.strokeStyle='#f3d383';c.lineWidth=2;
  c.beginPath();c.moveTo(0,-25);c.lineTo(0,-17);c.stroke();
  c.fillStyle='#f3d383';c.fillRect(-6,-20,12,4);
  var bg=c.createRadialGradient(-3,-9,2,0,-1,17);
  bg.addColorStop(0,'#ffe08a');bg.addColorStop(.55,'#e8323f');bg.addColorStop(1,'#b30e26');
  c.fillStyle=bg;c.beginPath();c.ellipse(0,-2,13,11,0,0,7);c.fill();
  c.strokeStyle='rgba(255,232,168,.5)';c.lineWidth=1;
  c.beginPath();c.ellipse(0,-2,6.5,11,0,0,7);c.stroke();
  c.fillStyle='#f3d383';c.fillRect(-6,7,12,3.5);
  c.strokeStyle='#ffd94a';c.lineWidth=1.8;
  c.beginPath();c.moveTo(0,10.5);c.lineTo(0,20);c.stroke();
  c.restore();
}
/* 玉兔（可缩放） */
function rabbit(c,cx,cy,s){
  c.save();c.translate(cx,cy);c.scale(s,s);
  c.fillStyle='#f4eedd';
  c.beginPath();c.arc(-9,9,19,0,7);c.fill();
  c.beginPath();c.arc(8,-6,12.5,0,7);c.fill();
  c.save();c.translate(2,-22);c.rotate(-.22);c.beginPath();c.ellipse(0,0,4.6,13.5,0,0,7);c.fill();c.restore();
  c.save();c.translate(14,-19);c.rotate(.18);c.beginPath();c.ellipse(0,0,4.4,12.5,0,0,7);c.fill();c.restore();
  c.restore();
}
/* 满月（带光晕与环形山） */
function moonAt(c,deg,r){
  var p=ringPos(deg);
  var halo=c.createRadialGradient(p[0],p[1],4,p[0],p[1],r*1.9);
  halo.addColorStop(0,'rgba(255,238,178,.5)');halo.addColorStop(1,'rgba(255,238,178,0)');
  c.fillStyle=halo;c.beginPath();c.arc(p[0],p[1],r*1.9,0,7);c.fill();
  c.fillStyle='#f8ecc9';c.beginPath();c.arc(p[0],p[1],r,0,7);c.fill();
  c.fillStyle='rgba(226,207,150,.8)';
  c.beginPath();c.arc(p[0]-r*.3,p[1]-r*.18,r*.17,0,7);c.fill();
  c.beginPath();c.arc(p[0]+r*.26,p[1]+r*.24,r*.12,0,7);c.fill();
  return p;
}
/* 五瓣小花 */
function flower(c,cx,cy,r,color,center){
  for(var i=0;i<5;i++){var a=i*2*Math.PI/5-Math.PI/2;
    c.fillStyle=color;c.beginPath();c.arc(cx+Math.cos(a)*r*.62,cy+Math.sin(a)*r*.62,r*.42,0,7);c.fill();}
  c.fillStyle=center;c.beginPath();c.arc(cx,cy,r*.3,0,7);c.fill();
}

function cloud(c,cx,cy,s,color){

/* 山峰（带雪顶） */
function mountain(c,cx,cy,s,color,snow){
  c.save();c.translate(cx,cy);c.scale(s,s);

/* 标准比例五星红旗（30x20 规格，不作变形） */
function drawFlag(c,x,y,u){
  var bigX=x+5*u,bigY=y+5*u;
  c.fillStyle='#DE2910';c.fillRect(x,y,15*u,10*u);
  star(c,bigX,bigY,3*u,0,'#FFDE00');
  var smalls=[[10,2],[12,4],[12,7],[10,9]];
  for(var i=0;i<4;i++){
    var sx=x+smalls[i][0]*u,sy=y+smalls[i][1]*u;
    var ang=Math.atan2(bigY-sy,bigX-sx);
    star(c,sx,sy,u,ang+Math.PI/2,'#FFDE00');
  }
}

/* ─────────── 交互 ─────────── */
dz.addEventListener('click',function(){fileInput.click();});
fileInput.addEventListener('change',function(){loadFile(this.files[0]);this.value='';});
['dragover','dragenter'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.add('drag');});});
['dragleave','drop'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.remove('drag');});});
dz.addEventListener('drop',function(ev){loadFile(ev.dataTransfer.files[0]);});

document.getElementById('frames').addEventListener('click',function(ev){
  var chip=ev.target.closest('.frame-chip');if(!chip)return;
  document.querySelectorAll('#frames .frame-chip').forEach(function(x){x.classList.remove('sel');});
  chip.classList.add('sel');frame=chip.dataset.f;render();
});
document.getElementById('styles').addEventListener('click',function(ev){
  var chip=ev.target.closest('.frame-chip');if(!chip)return;
  document.querySelectorAll('#styles .frame-chip').forEach(function(x){x.classList.remove('sel');});
  chip.classList.add('sel');style=chip.dataset.s;
  document.getElementById('frames').classList.toggle('disabled',style!=='ring');
  render();
});
document.getElementById('zoom').addEventListener('input',function(){zoom=+this.value;render();});
document.getElementById('btnChange').addEventListener('click',function(){fileInput.click();});

/* 拖拽 / 双指缩放 */
var ptrs=new Map(),lastDist=0,lastMid=null;
function canvasXY(ev){var r=cv.getBoundingClientRect();return [(ev.clientX-r.left)*(S/r.width),(ev.clientY-r.top)*(S/r.height)];}
cv.addEventListener('pointerdown',function(ev){if(!img)return;cv.setPointerCapture(ev.pointerId);ptrs.set(ev.pointerId,ev);});
cv.addEventListener('pointermove',function(ev){
  if(!img||!ptrs.has(ev.pointerId))return;
  if(ptrs.size===1){
    var p=canvasXY(ev),lp=ptrs.get(ev.pointerId),l=canvasXY(lp);
    ox+=p[0]-l[0];oy+=p[1]-l[1];clampOff();render();ptrs.set(ev.pointerId,ev);
  }else if(ptrs.size===2){
    ptrs.set(ev.pointerId,ev);
    var pts=[...ptrs.values()];
    var a=canvasXY(pts[0]),b=canvasXY(pts[1]);
    var d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    var mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    if(lastDist){
      var nz=Math.max(1,Math.min(3,zoom*d/lastDist));
      ox=mid[0]-(mid[0]-ox)*nz/zoom;oy=mid[1]-(mid[1]-oy)*nz/zoom;
      zoom=nz;document.getElementById('zoom').value=zoom;
      clampOff();render();
    }
    lastDist=d;lastMid=mid;
  }
});
function endPtr(ev){ptrs.delete(ev.pointerId);if(ptrs.size<2){lastDist=0;lastMid=null;}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',function(ev){
  if(!img)return;ev.preventDefault();
  var nz=Math.max(1,Math.min(3,zoom*(ev.deltaY<0?1.07:0.93)));
  var p=canvasXY(ev);
  ox=p[0]-(p[0]-ox)*nz/zoom;oy=p[1]-(p[1]-oy)*nz/zoom;
  zoom=nz;document.getElementById('zoom').value=zoom;clampOff();render();
},{passive:false});

/* 生成与弹层 */
var modal=document.getElementById('modal'),resultImg=document.getElementById('resultImg'),btnDl=document.getElementById('btnDl');
var modalHint=document.querySelector('.modal-hint');
/* 微信/QQ 内置浏览器不支持 a[download]，也不能保存 blob: 图片；
   改用 data: URL（长按即可保存到相册） */
var UA=navigator.userAgent;
var IN_WECHAT=/MicroMessenger/i.test(UA);
var IN_APP=/MicroMessenger|QQ\/|AlipayClient|DingTalk|Weibo/i.test(UA);
if(IN_WECHAT){
  btnDl.style.display='none';
  modalHint.innerHTML='长按上方图片 → 保存到手机相册<br>保存后可在微信里直接设为头像<br><span style="font-size:.82em;opacity:.75">若长按无反应：点右上角 ··· 选择「在浏览器打开」</span>';
}else if(IN_APP){
  btnDl.style.display='none';
  modalHint.innerHTML='长按上方图片 → 保存到手机相册';
}
document.getElementById('btnGen').addEventListener('click',function(){
  if(!img)return;
  var data=cv.toDataURL('image/png');
  resultImg.src=data;btnDl.href=data;
  modal.classList.add('on');
});
document.getElementById('btnAgain').addEventListener('click',function(){modal.classList.remove('on');});
modal.addEventListener('click',function(ev){if(ev.target===modal)modal.classList.remove('on');});
</script>
